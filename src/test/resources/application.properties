# Configuração exclusiva do ambiente de teste.
# Estas propriedades sobrescrevem as de src/main/resources/application.properties
# durante os testes; as demais (H2, OpenAPI etc.) continuam sendo herdadas.

# JWT: par de chaves RSA exclusivo para testes (fixtures sem uso fora dos testes).
# A chave privada de desenvolvimento (privateKey.pem) não é utilizada aqui.
smallrye.jwt.sign.key.location=test-privateKey.pem
smallrye.jwt.new-token.lifespan=3600
mp.jwt.verify.publickey.location=test-publicKey.pem
mp.jwt.verify.issuer=users-issuer
